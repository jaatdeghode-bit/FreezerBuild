name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Extract Project Files
        run: |
          mkdir -p temp_extracted
          unzip -q FreezerFrenzyAuto_v0.3.zip -d temp_extracted
          PROJECT_PATH=$(find temp_extracted -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          if [ -n "$PROJECT_PATH" ]; then
            echo "Project root found at: $PROJECT_PATH"
            cp -r "$PROJECT_PATH"/* .
          else
            cp -r temp_extracted/* .
          fi

      - name: Setup Gradle and Build APK
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 7.5.1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreezerFrenzy-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
