name: Unzip and Auto Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Files
        run: |
          echo "=== REPO FILES ==="
          ls -la
          echo "=== UNZIPPING ZIP FILE ==="
          unzip -o FreezerFrenzyAuto_v0.3.zip -d extracted || true
          echo "=== FINDING GRADLE FILES ==="
          find extracted -name "build.gradle*" || echo "No build.gradle found!"
          
          
