name: Unzip and Auto Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Extract and Setup Project
        run: mkdir -p extracted && unzip -o FreezerFrenzyAuto_v0.3.zip -d extracted && cp -r $(find extracted -name "build.gradle*" | head -n 1 | xargs dirname)/* .

      - name: Build APK
        run: gradle wrapper --gradle-version 7.5.1 && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreezerFrenzy-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
