name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract and Patch Project Files
        run: |
          mkdir -p temp_extracted
          unzip -q FreezerFrenzyAuto_v0.3.zip -d temp_extracted
          PROJECT_PATH=$(find temp_extracted -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          if [ -n "$PROJECT_PATH" ]; then
            cp -r "$PROJECT_PATH"/* .
          else
            cp -r temp_extracted/* .
          fi
          
          # Fix plugin version issue automatically if present in build.gradle
          if [ -f "build.gradle" ]; then
            echo "Patching build.gradle to fix plugin versions..."
            sed -i 's/id '\''com.android.application'\''/id '\''com.android.application'\'' version '\''7.4.2'\''/g' build.gradle || true
            sed -i 's/id '\''com.android.library'\''/id '\''com.android.library'\'' version '\''7.4.2'\''/g' build.gradle || true
          fi

      - name: Setup Gradle and Build APK
        run: |
          gradle wrapper --gradle-version 7.5.1
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreezerFrenzy-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
